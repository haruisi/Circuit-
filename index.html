<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>回路図メーカー</title>

  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f4f4f4;
      color: #222;
      overscroll-behavior: none;
      touch-action: none;
    }

    .app {
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      padding: 10px 12px 6px;
      background: #ffffff;
      border-bottom: 1px solid #ddd;
    }

    h1 {
      margin: 0;
      font-size: 17px;
      font-weight: 700;
    }

    .hint {
      margin-top: 4px;
      font-size: 12px;
      color: #666;
    }

    .toolbar {
      display: flex;
      gap: 8px;
      padding: 8px;
      background: #ffffff;
      border-bottom: 1px solid #ddd;
      overflow-x: auto;
      white-space: nowrap;
    }

    button {
      border: 1px solid #ccc;
      background: #fff;
      border-radius: 10px;
      padding: 9px 12px;
      font-size: 14px;
      font-weight: 600;
      color: #222;
      min-width: 58px;
    }

    button.active {
      background: #222;
      color: #fff;
      border-color: #222;
    }

    button.danger {
      color: #b00020;
      border-color: #e0b6c0;
    }

    button.save {
      background: #111;
      color: white;
      border-color: #111;
    }

    .canvas-wrap {
      flex: 1;
      position: relative;
      overflow: hidden;
      background: #fafafa;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
      touch-action: none;
      background: transparent;
    }

    .status {
      position: absolute;
      left: 10px;
      bottom: 10px;
      background: rgba(255,255,255,0.92);
      border: 1px solid #ddd;
      border-radius: 10px;
      padding: 6px 10px;
      font-size: 12px;
      color: #333;
      pointer-events: none;
    }
  </style>
</head>

<body>
  <div class="app">
    <header>
      <h1>回路図メーカー</h1>
      <div class="hint">部品を選ぶ → 格子点を2回タップ。保存は透明背景PNGです。</div>
    </header>

    <div class="toolbar">
      <button data-tool="wire" class="active">導線</button>
      <button data-tool="resistor">抵抗</button>
      <button data-tool="variableResistor">可変抵抗</button>
      <button data-tool="battery">電源</button>
      <button data-tool="ground">アース</button>
      <button data-tool="capacitor">コンデンサー</button>
      <button data-tool="metalPlate">金属板</button>
      <button data-tool="switchContact">スイッチ</button>
      <button data-tool="galvanometer">検流計</button>
      <button data-tool="voltmeter">電圧計</button>
      <button data-tool="ammeter">電流計</button>
      <button data-tool="resistanceWire">抵抗線</button>
      <button data-tool="sliderContact">可動接点</button>
      <button data-tool="junction">接続点</button>
      <button data-tool="eraser">消しゴム</button>
      <button id="undoBtn">戻る</button>
      <button id="clearBtn" class="danger">全消し</button>
      <button id="saveBtn" class="save">PNG保存</button>
    </div>

    <div class="canvas-wrap">
      <canvas id="canvas"></canvas>
      <div class="status" id="status">導線モード</div>
    </div>
  </div>

  <script>
    const canvas = document.getElementById("canvas");
    const ctx = canvas.getContext("2d");
    const statusEl = document.getElementById("status");

    const GRID = 32;
    const LINE_WIDTH = 3;
    const EXPORT_PADDING = 36;

    let dpr = window.devicePixelRatio || 1;
    let tool = "wire";
    let firstPoint = null;
    let items = [];

    const toolNames = {
      wire: "導線",
      resistor: "抵抗",
      variableResistor: "可変抵抗",
      battery: "電源",
      ground: "アース",
      capacitor: "コンデンサー",
      metalPlate: "金属板",
      switchContact: "スイッチ接点",
      galvanometer: "検流計",
      voltmeter: "電圧計",
      ammeter: "電流計",
      resistanceWire: "抵抗線",
      sliderContact: "可動接点",
      junction: "接続点",
      eraser: "消しゴム"
    };

    function resizeCanvas() {
      const rect = canvas.getBoundingClientRect();
      canvas.width = Math.floor(rect.width * dpr);
      canvas.height = Math.floor(rect.height * dpr);
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      draw();
    }

    window.addEventListener("resize", resizeCanvas);

    document.querySelectorAll("[data-tool]").forEach(button => {
      button.addEventListener("click", () => {
        tool = button.dataset.tool;
        firstPoint = null;

        document.querySelectorAll("[data-tool]").forEach(b => b.classList.remove("active"));
        button.classList.add("active");

        statusEl.textContent = `${toolNames[tool]}モード`;
        draw();
      });
    });

    document.getElementById("undoBtn").addEventListener("click", () => {
      items.pop();
      firstPoint = null;
      draw();
    });

    document.getElementById("clearBtn").addEventListener("click", () => {
      if (items.length === 0) return;
      if (confirm("全部消しますか？")) {
        items = [];
        firstPoint = null;
        draw();
      }
    });

    document.getElementById("saveBtn").addEventListener("click", saveTransparentPNG);

    canvas.addEventListener("pointerdown", e => {
      e.preventDefault();

      const p = getGridPoint(e);

      if (tool === "eraser") {
        eraseNearest(p);
        draw();
        return;
      }

      if (tool === "junction" || tool === "ground" || tool === "sliderContact") {
        items.push({ type: tool, x1: p.x, y1: p.y, x2: p.x, y2: p.y });
        draw();
        return;
      }

      if (!firstPoint) {
        firstPoint = p;
        draw();
        return;
      }

      if (firstPoint.x === p.x && firstPoint.y === p.y) {
        firstPoint = null;
        draw();
        return;
      }

      items.push({
        type: tool,
        x1: firstPoint.x,
        y1: firstPoint.y,
        x2: p.x,
        y2: p.y
      });

      firstPoint = null;
      draw();
    });

    function getGridPoint(e) {
      const rect = canvas.getBoundingClientRect();
      const x = e.clientX - rect.left;
      const y = e.clientY - rect.top;

      return {
        x: Math.round(x / GRID) * GRID,
        y: Math.round(y / GRID) * GRID
      };
    }

    function draw() {
      const rect = canvas.getBoundingClientRect();
      ctx.clearRect(0, 0, rect.width, rect.height);

      drawGrid(ctx, rect.width, rect.height);

      for (const item of items) {
        drawItem(ctx, item);
      }

      if (firstPoint) {
        ctx.save();
        ctx.fillStyle = "#111";
        ctx.beginPath();
        ctx.arc(firstPoint.x, firstPoint.y, 6, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }
    }

    function drawGrid(c, w, h) {
      c.save();
      c.strokeStyle = "#e3e3e3";
      c.lineWidth = 1;

      for (let x = 0; x <= w; x += GRID) {
        c.beginPath();
        c.moveTo(x, 0);
        c.lineTo(x, h);
        c.stroke();
      }

      for (let y = 0; y <= h; y += GRID) {
        c.beginPath();
        c.moveTo(0, y);
        c.lineTo(w, y);
        c.stroke();
      }

      c.restore();
    }

    function drawItem(c, item) {
      switch (item.type) {
        case "wire":
          drawWire(c, item);
          break;
        case "resistor":
          drawResistor(c, item);
          break;
        case "variableResistor":
          drawVariableResistor(c, item);
          break;
        case "battery":
          drawBattery(c, item);
          break;
        case "ground":
          drawGround(c, item);
          break;
        case "capacitor":
          drawCapacitor(c, item);
          break;
        case "metalPlate":
          drawMetalPlate(c, item);
          break;
        case "switchContact":
          drawSwitchContact(c, item);
          break;
        case "galvanometer":
          drawMeter(c, item, "G");
          break;
        case "voltmeter":
          drawMeter(c, item, "V");
          break;
        case "ammeter":
          drawMeter(c, item, "A");
          break;
        case "resistanceWire":
          drawResistanceWire(c, item);
          break;
        case "sliderContact":
          drawSliderContact(c, item);
          break;
        case "junction":
          drawJunction(c, item.x1, item.y1);
          break;
      }
    }

    function setupLine(c) {
      c.strokeStyle = "#111";
      c.fillStyle = "#111";
      c.lineWidth = LINE_WIDTH;
      c.lineCap = "round";
      c.lineJoin = "round";
      c.font = "bold 24px -apple-system, BlinkMacSystemFont, sans-serif";
      c.textAlign = "center";
      c.textBaseline = "middle";
    }

    function getTransform(item) {
      const dx = item.x2 - item.x1;
      const dy = item.y2 - item.y1;
      const length = Math.hypot(dx, dy);
      const angle = Math.atan2(dy, dx);
      return {
        dx,
        dy,
        length,
        angle,
        cx: (item.x1 + item.x2) / 2,
        cy: (item.y1 + item.y2) / 2
      };
    }

    function withLocal(c, item, drawFn) {
      const t = getTransform(item);
      c.save();
      c.translate(t.cx, t.cy);
      c.rotate(t.angle);
      drawFn(c, t.length);
      c.restore();
    }

    function drawWire(c, item) {
      c.save();
      setupLine(c);
      c.beginPath();
      c.moveTo(item.x1, item.y1);
      c.lineTo(item.x2, item.y2);
      c.stroke();
      c.restore();
    }

    function drawJunction(c, x, y) {
      c.save();
      setupLine(c);
      c.beginPath();
      c.arc(x, y, 5.5, 0, Math.PI * 2);
      c.fill();
      c.restore();
    }

    function drawResistor(c, item) {
      withLocal(c, item, (c, length) => {
        setupLine(c);

        const body = Math.min(72, Math.max(44, length * 0.45));
        const left = -length / 2;
        const right = length / 2;
        const bodyLeft = -body / 2;
        const bodyRight = body / 2;
        const amp = 10;
        const steps = 6;
        const step = body / steps;

        c.beginPath();
        c.moveTo(left, 0);
        c.lineTo(bodyLeft, 0);

        for (let i = 0; i <= steps; i++) {
          const x = bodyLeft + i * step;
          const y = i % 2 === 0 ? -amp : amp;
          c.lineTo(x, y);
        }

        c.lineTo(bodyRight, 0);
        c.lineTo(right, 0);
        c.stroke();
      });
    }

    function drawVariableResistor(c, item) {
      drawResistor(c, item);

      withLocal(c, item, (c, length) => {
        setupLine(c);

        const arrowLen = 58;
        const x1 = -arrowLen / 2;
        const y1 = 28;
        const x2 = arrowLen / 2;
        const y2 = -28;

        c.beginPath();
        c.moveTo(x1, y1);
        c.lineTo(x2, y2);
        c.stroke();

        drawArrowHead(c, x2, y2, Math.atan2(y2 - y1, x2 - x1));
      });
    }

    function drawBattery(c, item) {
      withLocal(c, item, (c, length) => {
        setupLine(c);

        const left = -length / 2;
        const right = length / 2;
        const gap = 10;
        const shortH = 28;
        const longH = 48;

        c.beginPath();
        c.moveTo(left, 0);
        c.lineTo(-gap, 0);
        c.moveTo(gap, 0);
        c.lineTo(right, 0);
        c.stroke();

        c.beginPath();
        c.moveTo(-gap, -shortH / 2);
        c.lineTo(-gap, shortH / 2);
        c.moveTo(gap, -longH / 2);
        c.lineTo(gap, longH / 2);
        c.stroke();
      });
    }

    function drawCapacitor(c, item) {
      withLocal(c, item, (c, length) => {
        setupLine(c);

        const left = -length / 2;
        const right = length / 2;
        const gap = 10;
        const h = 48;

        c.beginPath();
        c.moveTo(left, 0);
        c.lineTo(-gap, 0);
        c.moveTo(gap, 0);
        c.lineTo(right, 0);
        c.stroke();

        c.beginPath();
        c.moveTo(-gap, -h / 2);
        c.lineTo(-gap, h / 2);
        c.moveTo(gap, -h / 2);
        c.lineTo(gap, h / 2);
        c.stroke();
      });
    }

    function drawMetalPlate(c, item) {
      withLocal(c, item, (c, length) => {
        setupLine(c);

        const left = -length / 2;
        const right = length / 2;
        const gap = 18;
        const plateH = 54;
        const metalH = 42;

        c.beginPath();
        c.moveTo(left, 0);
        c.lineTo(-gap, 0);
        c.moveTo(gap, 0);
        c.lineTo(right, 0);
        c.stroke();

        c.beginPath();
        c.moveTo(-gap, -plateH / 2);
        c.lineTo(-gap, plateH / 2);
        c.moveTo(gap, -plateH / 2);
        c.lineTo(gap, plateH / 2);
        c.stroke();

        c.lineWidth = 5;
        c.beginPath();
        c.moveTo(0, -metalH / 2);
        c.lineTo(0, metalH / 2);
        c.stroke();
      });
    }

    function drawSwitchContact(c, item) {
      withLocal(c, item, (c, length) => {
        setupLine(c);

        const left = -length / 2;
        const right = length / 2;
        const gap = 30;

        c.beginPath();
        c.moveTo(left, 0);
        c.lineTo(-gap / 2, 0);
        c.moveTo(gap / 2, 0);
        c.lineTo(right, 0);
        c.stroke();

        c.beginPath();
        c.arc(-gap / 2, 0, 5.5, 0, Math.PI * 2);
        c.arc(gap / 2, 0, 5.5, 0, Math.PI * 2);
        c.fill();
      });
    }

    function drawMeter(c, item, label) {
      withLocal(c, item, (c, length) => {
        setupLine(c);

        const left = -length / 2;
        const right = length / 2;
        const r = 24;

        c.beginPath();
        c.moveTo(left, 0);
        c.lineTo(-r, 0);
        c.moveTo(r, 0);
        c.lineTo(right, 0);
        c.stroke();

        c.beginPath();
        c.arc(0, 0, r, 0, Math.PI * 2);
        c.stroke();

        c.fillText(label, 0, 1);
      });
    }

    function drawGround(c, item) {
      c.save();
      setupLine(c);

      const x = item.x1;
      const y = item.y1;

      c.beginPath();
      c.moveTo(x, y - 30);
      c.lineTo(x, y);
      c.stroke();

      c.beginPath();
      c.moveTo(x - 22, y);
      c.lineTo(x + 22, y);
      c.moveTo(x - 15, y + 10);
      c.lineTo(x + 15, y + 10);
      c.moveTo(x - 8, y + 20);
      c.lineTo(x + 8, y + 20);
      c.stroke();

      c.restore();
    }

    function drawResistanceWire(c, item) {
      withLocal(c, item, (c, length) => {
        setupLine(c);

        const left = -length / 2;
        const right = length / 2;

        c.beginPath();
        c.moveTo(left, 0);
        c.lineTo(right, 0);
        c.stroke();

        c.lineWidth = 1.8;
        c.beginPath();

        const waveAmp = 7;
        const waveLen = 12;
        for (let x = left; x <= right; x += 2) {
          const y = Math.sin((x - left) / waveLen * Math.PI * 2) * waveAmp;
          if (x === left) c.moveTo(x, y);
          else c.lineTo(x, y);
        }

        c.stroke();
      });
    }

    function drawSliderContact(c, item) {
      c.save();
      setupLine(c);

      const x = item.x1;
      const y = item.y1;

      c.beginPath();
      c.arc(x, y, 6, 0, Math.PI * 2);
      c.fill();

      c.beginPath();
      c.moveTo(x, y - 36);
      c.lineTo(x, y - 6);
      c.stroke();

      c.beginPath();
      c.moveTo(x - 10, y - 24);
      c.lineTo(x, y - 6);
      c.lineTo(x + 10, y - 24);
      c.stroke();

      c.restore();
    }

    function drawArrowHead(c, x, y, angle) {
      const size = 10;
      c.beginPath();
      c.moveTo(x, y);
      c.lineTo(
        x - size * Math.cos(angle - Math.PI / 6),
        y - size * Math.sin(angle - Math.PI / 6)
      );
      c.moveTo(x, y);
      c.lineTo(
        x - size * Math.cos(angle + Math.PI / 6),
        y - size * Math.sin(angle + Math.PI / 6)
      );
      c.stroke();
    }

    function eraseNearest(p) {
      if (items.length === 0) return;

      let bestIndex = -1;
      let bestDistance = Infinity;

      for (let i = 0; i < items.length; i++) {
        const item = items[i];
        const d = distancePointToItem(p, item);

        if (d < bestDistance) {
          bestDistance = d;
          bestIndex = i;
        }
      }

      if (bestIndex >= 0 && bestDistance < 34) {
        items.splice(bestIndex, 1);
      }
    }

    function distancePointToItem(p, item) {
      if (item.x1 === item.x2 && item.y1 === item.y2) {
        return Math.hypot(p.x - item.x1, p.y - item.y1);
      }

      const x1 = item.x1;
      const y1 = item.y1;
      const x2 = item.x2;
      const y2 = item.y2;

      const dx = x2 - x1;
      const dy = y2 - y1;
      const len2 = dx * dx + dy * dy;

      let t = ((p.x - x1) * dx + (p.y - y1) * dy) / len2;
      t = Math.max(0, Math.min(1, t));

      const px = x1 + t * dx;
      const py = y1 + t * dy;

      return Math.hypot(p.x - px, p.y - py);
    }

    function getBounds() {
      if (items.length === 0) {
        return {
          minX: 0,
          minY: 0,
          maxX: canvas.getBoundingClientRect().width,
          maxY: canvas.getBoundingClientRect().height
        };
      }

      let minX = Infinity;
      let minY = Infinity;
      let maxX = -Infinity;
      let maxY = -Infinity;

      for (const item of items) {
        minX = Math.min(minX, item.x1, item.x2);
        minY = Math.min(minY, item.y1, item.y2);
        maxX = Math.max(maxX, item.x1, item.x2);
        maxY = Math.max(maxY, item.y1, item.y2);
      }

      return {
        minX: minX - EXPORT_PADDING,
        minY: minY - EXPORT_PADDING,
        maxX: maxX + EXPORT_PADDING,
        maxY: maxY + EXPORT_PADDING
      };
    }

    function saveTransparentPNG() {
      const bounds = getBounds();
      const w = Math.max(160, bounds.maxX - bounds.minX);
      const h = Math.max(160, bounds.maxY - bounds.minY);

      const exportCanvas = document.createElement("canvas");
      const scale = 3;

      exportCanvas.width = Math.ceil(w * scale);
      exportCanvas.height = Math.ceil(h * scale);

      const ex = exportCanvas.getContext("2d");
      ex.setTransform(scale, 0, 0, scale, -bounds.minX * scale, -bounds.minY * scale);

      // 透明背景なので背景は描かない
      for (const item of items) {
        drawItem(ex, item);
      }

      exportCanvas.toBlob(blob => {
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = "circuit-transparent.png";
        document.body.appendChild(a);
        a.click();
        a.remove();

        setTimeout(() => URL.revokeObjectURL(url), 1000);
      }, "image/png");
    }

    resizeCanvas();
  </script>
</body>
</html>
